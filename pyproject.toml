[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filecli"
version = "0.2.0"
description = "A DOS-inspired, keyboard-driven terminal file manager"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["terminal", "file-manager", "tui", "linux", "textual"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Filesystems",
]
dependencies = [
  "textual>=0.80,<2",
  "rich>=13.7",
  "typer>=0.12",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
filecli = "filecli.cli:entrypoint"

[project.urls]
Homepage = "https://github.com/proxyarray/FileCLI"
Repository = "https://github.com/proxyarray/FileCLI"
Issues = "https://github.com/proxyarray/FileCLI/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
